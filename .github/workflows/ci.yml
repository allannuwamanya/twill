name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: go.sum

      # main.go embeds all:frontend/dist, and dist/ is gitignored, so on a clean
      # checkout the pattern matches nothing and vet/test fail to compile at all.
      # Vet and test never read the assets, so a stub is enough to satisfy the
      # embed; the Build job below compiles against the real bundle.
      - name: Stub embedded assets
        run: mkdir -p frontend/dist && echo '<!doctype html>' > frontend/dist/index.html

      # gofmt is checked separately from vet: vet passes on badly formatted code.
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # -race is not optional here: the adapters have concurrent readers and
      # writers, and a plain `go test` has hidden real races before.
      - name: Test
        run: go test -race ./...

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # wails.json drives the frontend with pnpm, so the lockfile is pnpm's.
      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Test
        run: pnpm run test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: go.sum

      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # wails build shells out to `pnpm install` and `pnpm run build` (wails.json),
      # so pnpm has to be on PATH before the Wails CLI runs.
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.0-dev build-essential

      - run: wails build -tags webkit2_41